services:
  - type: web
    name: llm-optimizer
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: FLASK_SECRET_KEY
        sync: false
      - key: PYTHON_VERSION
        value: 3.11
    routes:
      - type: rewrite
        source: /llm-optimizer
        destination: /llm-optimizer